<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Emmanuel Senior Secondary School</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .contact-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
      margin-top: 24px;
    }
    form {
      display: grid;
      gap: 14px;
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0,0,0,.05);
    }
    .info-box {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0,0,0,.05);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <div class="brand">
        <img src="assets/logo.png" alt="School logo" />
        <div>
          <div style="font-weight: 800; color: var(--maroon);">Emmanuel Senior Secondary School</div>
        </div>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="admissions.html">Admissions</a>
        <a href="faculty.html">Faculty</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h2 class="section-title">Contact Us</h2>

    <div class="contact-grid">
      <form action="https://formspree.io/f/xaeqkpqv" method="POST">
        <label>Student / Parent Name</label>
        <input type="text" name="name" required />

        <label>Email Address</label>
        <input type="email" name="email" required />

        <label>Phone Number</label>
        <input type="tel" name="phone" required />

        <label>Subject</label>
        <input type="text" name="subject" />

        <label>Message</label>
        <textarea name="message" rows="5" required></textarea>

        <button type="submit">Submit Message</button>
      </form>

      <div class="info-box">
        <h3>School Office</h3>
        <p><strong>Emmanuel Senior Secondary School</strong></p>
        <p>Jaipur Road, Near Bus Stand, Kali Paltan, Tonk, Rajasthan 304001</p>
        <p>Phone: +91 01432 248049</p>
        <p>Email: emmanueltonk@rediffmail.com</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 Emmanuel Senior Secondary School</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
